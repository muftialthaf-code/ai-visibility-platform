name: Deploy site

# Manual for now. Phase 2 adds automatic deploys on merge, one job per active tenant.
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant folder name under /tenants
        required: true
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      TENANT: ${{ inputs.tenant }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate tenant
        run: pnpm tenant:validate "$TENANT"
      - name: Build site
        env:
          # Staging builds tell crawlers to stay away (robots.txt and noindex).
          SITE_ENV: ${{ inputs.environment == 'staging' && 'staging' || 'production' }}
        run: pnpm build:site
      - name: Audit site
        run: pnpm audit:site "$TENANT"
      - name: Deploy to Cloudflare Pages
        env:
          BRANCH: ${{ inputs.environment == 'production' && 'main' || 'staging' }}
        run: npx --yes wrangler@4 pages deploy "dist/sites/$TENANT" --project-name="${{ vars.CLOUDFLARE_PROJECT_PREFIX || 'avp' }}-$TENANT" --branch="$BRANCH"
