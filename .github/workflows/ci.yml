name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate every tenant config (including the blank template)
        run: pnpm tenant:validate
      - name: Build every tenant site
        run: |
          for dir in tenants/*/; do
            id=$(basename "$dir")
            echo "::group::build $id"
            TENANT="$id" pnpm build:site
            echo "::endgroup::"
          done
      - name: Audit built sites (AEO/GEO technical requirements)
        run: pnpm audit:site
