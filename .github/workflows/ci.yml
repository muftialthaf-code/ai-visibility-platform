name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validate every tenant config (including the blank template)
        run: pnpm tenant:validate
      - name: Build and audit the affected tenant sites
        # Shared code changes rebuild every tenant. A change inside one tenant folder (every agent
        # article PR) builds only that tenant, so CI cost does not grow with the number of tenants.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ids=$(pnpm -s avp matrix --kind ci --changed-since "$BASE" | jq -r '.include[].tenant')
          if [ -z "$ids" ]; then echo "No tenant sites affected."; exit 0; fi
          for id in $ids; do
            echo "::group::build $id"
            TENANT="$id" pnpm build:site
            pnpm -s avp audit "$id"
            echo "::endgroup::"
          done
