name: Article agent

# Writes each active business's daily article and opens a pull request for review.
# Nothing runs until the repository variable AGENT_ENABLED is "true" and the secrets exist,
# so merging this workflow before credentials are ready is safe.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tenant:
        description: Business id (leave blank for every business whose agent is running)
        required: false
      dry_run:
        description: Write and check an article but do not open a pull request
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          INPUT_TENANT: ${{ inputs.tenant }}
        run: |
          if [ -n "$INPUT_TENANT" ]; then
            key=$(printf '%s' "$INPUT_TENANT" | tr 'a-z-' 'A-Z_')
            matrix=$(printf '{"include":[{"tenant":"%s","key":"%s"}]}' "$INPUT_TENANT" "$key")
          else
            matrix=$(pnpm -s avp matrix --kind agent)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Agent matrix: $matrix"

  write:
    needs: plan
    if: ${{ vars.AGENT_ENABLED == 'true' && fromJSON(needs.plan.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # A few at a time keeps model rate limits and database connections calm. Raise it as the number of businesses grows.
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # One run per business at a time; a second one waits rather than writing a duplicate.
    concurrency:
      group: agent-${{ matrix.tenant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write the article
        env:
          # A business can have its own key (ANTHROPIC_API_KEY__<ID>) so its usage is billed separately.
          ANTHROPIC_API_KEY: ${{ secrets[format('ANTHROPIC_API_KEY__{0}', matrix.key)] || secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
          # Pull requests opened with the built-in token do not start CI. A personal token or GitHub App token does.
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          WEB_SEARCH_USD_PER_REQUEST: ${{ vars.WEB_SEARCH_USD_PER_REQUEST }}
          TENANT: ${{ matrix.tenant }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: pnpm -s avp agent run "$TENANT" --trigger "$TRIGGER" $DRY_RUN
